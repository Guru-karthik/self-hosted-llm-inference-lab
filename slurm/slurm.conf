# Single-node Slurm sandbox (Phase H): controller and compute daemon on the same WSL2
# machine, to try scheduling concepts. This is NOT an HPC cluster.
# __HOST__ is replaced with `hostname -s` by scripts/setup-slurm-wsl.sh.
ClusterName=labsandbox
# The WSL hostname resolves to a link-local IPv6 address, so pin loopback.
SlurmctldHost=__HOST__(127.0.0.1)
SlurmUser=slurm
AuthType=auth/munge

StateSaveLocation=/var/lib/slurm/slurmctld
SlurmdSpoolDir=/var/lib/slurm/slurmd
SlurmctldPidFile=/run/slurmctld/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
ReturnToService=2
MpiDefault=none

ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
# Without this a job gets all node memory by default and only one job fits at a time.
DefMemPerCPU=256
GresTypes=gpu

# Accounting through slurmdbd: required for sacct, accounts, fair-share and QoS.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
AccountingStorageEnforce=associations,limits,qos
AccountingStorageTRES=gres/gpu
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=5

# Priority = weighted sum of factors, each factor in 0..1. The weights are chosen to make
# the effects visible in a short demo; they are not a recommended production policy.
SchedulerType=sched/backfill
PriorityType=priority/multifactor
PriorityCalcPeriod=1
PriorityDecayHalfLife=7-0
PriorityMaxAge=1-0
PriorityWeightFairshare=100000
PriorityWeightQOS=200000
PriorityWeightPartition=10000
PriorityWeightAge=1000

# 15 GiB are visible in WSL2 and k3s runs beside Slurm, so offer only part of it.
NodeName=__HOST__ NodeAddr=127.0.0.1 Sockets=1 CoresPerSocket=8 ThreadsPerCore=2 RealMemory=6000 Gres=gpu:1 State=UNKNOWN

PartitionName=batch Nodes=ALL Default=YES MaxTime=02:00:00 PriorityJobFactor=1 State=UP
PartitionName=short Nodes=ALL MaxTime=00:10:00 PriorityJobFactor=10 State=UP
