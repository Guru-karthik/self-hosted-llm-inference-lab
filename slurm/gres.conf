# Declare the one GPU through /dev/dxg, the WSL2 paravirtual GPU device.
# Why not NVML autodetect: Ubuntu's Slurm 23.11.4 packages contain no gpu_nvml.so, and
# WSL2 has no /dev/nvidia0. Why not count only: slurmd 23.11.4 drops a file-less GPU and
# the node is drained (results/slurm/gres/count_only_drain.txt).
# This is bookkeeping only: Slurm queues jobs that ask for --gres=gpu:1, but it does NOT
# restrict device access (ConstrainDevices=no) and does not know that other processes,
# such as k3s pods, are using the same GPU.
NodeName=__HOST__ Name=gpu File=/dev/dxg
