# Accounting daemon for the Slurm sandbox. Installed as /etc/slurm/slurmdbd.conf,
# mode 600, owner slurm. No password: MariaDB authenticates the "slurm" OS user over
# the local unix socket.
AuthType=auth/munge
DbdHost=localhost
SlurmUser=slurm
StorageType=accounting_storage/mysql
StorageHost=localhost
StorageUser=slurm
StorageLoc=slurm_acct_db
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/run/slurmdbd/slurmdbd.pid
