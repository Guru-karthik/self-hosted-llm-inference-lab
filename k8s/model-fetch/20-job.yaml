# Fetch and verify one model into model-store. SOURCE HERE IS A file:// COPY of the old,
# hand-filled cache (mounted read-only), because pods in this cluster could not download
# from Hugging Face. No in-cluster download is tested.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-fetch
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: model-fetch
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: fetch
          # Only used for its Python; already present on the node.
          image: vllm/vllm-openai@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
          command: [python3, /fetch/fetch.py]
          args:
            - --manifest=/fetch/manifest.json
            - --source=file:///source/hub/models--Qwen--Qwen2.5-7B-Instruct-AWQ/snapshots/b25037543e9394b818fdfca67ab2a00ecc7dd641/
            - --dest=/models
            - --max-bytes=8000000000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 500m, memory: 128Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - {name: code, mountPath: /fetch, readOnly: true}
            - {name: source, mountPath: /source, readOnly: true}
            - {name: store, mountPath: /models}
      volumes:
        - name: code
          configMap:
            name: model-fetch
        - name: source
          persistentVolumeClaim:
            claimName: hf-cache
            readOnly: true
        - name: store
          persistentVolumeClaim:
            claimName: model-store
